## IDF Component Manager Manifest File
## 仅保留 dooirobot（ESP32-P4）实际使用的组件依赖，其它板型专属组件已移除
dependencies:
  # 联网：ESP32-P4 经 esp_hosted + esp_wifi_remote 使用 C6 的 WiFi
  # 78/esp-ml307 提供 NetworkInterface / Http / WebSocket / Mqtt / Udp 抽象接口（仅用其接口层）
  78/esp-wifi-connect: ~3.1.1
  78/esp-ml307: ~3.6.4
  espressif/esp_hosted:
    version: 2.11.7
    rules:
    - if: target in [esp32p4]
  espressif/esp_wifi_remote:
    version: '*'
    rules:
    - if: target in [esp32p4]

  # 显示：GC9A01 圆形 LCD + LVGL 主题/字体 + 表情动画
  espressif/esp_lcd_gc9a01: ==2.0.1
  lvgl/lvgl: ~9.4.0
  esp_lvgl_port: ~2.7.0
  78/xiaozhi-fonts: ~1.6.0
  espressif2022/esp_emote_expression: ^1.0.2

  # 音频：codec 驱动、AFE 唤醒词、重采样/编解码
  espressif/esp_codec_dev: ~1.5.4
  espressif/esp-sr: ~2.3.0
  espressif/esp_audio_effects: ~1.2.1
  espressif/esp_audio_codec: ~2.4.1

  # 摄像头与图像处理（P4 CSI + PPA/JPEG）
  espressif/esp_video:
    version: ==1.3.1   # 与当前工程代码匹配，升级需同步修改 app_vision
    rules:
    - if: target in [esp32p4]
  espressif/esp_image_effects: ^1.0.1
  espressif/esp_new_jpeg: ^1.0.0

  # 按键、灯效与局域网服务
  espressif/button: ~4.1.5
  espressif/led_strip: ~3.0.2
  espressif/mdns: '*'

  # 端侧视觉模型（app_vision/）
  espressif/esp-dl: "^3.3.8"
  espressif/hand_gesture_recognition: "^0.2.0"
  espressif/human_face_detect: "^0.5.0"

  ## Required IDF version
  idf:
    version: '>=5.5.2'
